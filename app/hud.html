<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>HUD</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  body{display:flex;justify-content:center;align-items:flex-start;padding:6px;box-sizing:border-box}
  body.bas{align-items:flex-end}

.hud{--op:.82;display:inline-flex;align-items:center;gap:14px;color:#fff;font-family:"Segoe UI",Inter,system-ui,sans-serif;user-select:none;transition:border-color .3s}
.hud .logo{width:36px;height:36px;border-radius:10px;background:#E7B655;color:#0F1720;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none}
.hud .logo.off{display:none}
.hud .sp{display:flex;align-items:baseline;gap:4px;min-width:92px}
.hud .sp b{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.hud .sp span{font-size:12px;color:#C3CDD6}
.hud .sp.over b{color:#F4B860}
.hud .lim{width:38px;height:38px;border-radius:50%;background:#fff;border:4px solid #D64545;box-sizing:border-box;display:flex;align-items:center;justify-content:center;color:#111;font-weight:800;font-size:14px;flex:none}
.hud .lim.off{visibility:hidden}
.hud .sep{width:1px;height:30px;background:rgba(255,255,255,.16)}
.hud .k{display:flex;flex-direction:column;gap:1px;font-size:11px;color:#C3CDD6;letter-spacing:.04em;text-transform:uppercase}
.hud .k b{font-size:16px;color:#fff;letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.hud .k.off{display:none}
.hud .mode{padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.06em;white-space:nowrap}
.hud .mode.real{background:rgba(111,216,196,.18);color:#8FE6D4}
.hud .mode.race{background:rgba(224,112,168,.22);color:#F2A6CC}
.hud .mode.none{background:rgba(255,255,255,.08);color:#C3CDD6}
/* Style « Bandeau » */
.hud.s-bandeau{height:56px;padding:0 16px 0 10px;border-radius:16px;background:rgba(12,16,22,var(--op));border:1px solid rgba(255,255,255,.12);box-shadow:0 6px 20px rgba(0,0,0,.35)}
.hud.s-bandeau.race{border-color:#E070A8}
/* Style « Compact » : l'essentiel seulement */
.hud.s-compact{height:46px;gap:10px;padding:0 12px 0 8px;border-radius:999px;background:rgba(12,16,22,var(--op));border:1px solid rgba(255,255,255,.12)}
.hud.s-compact .logo{width:30px;height:30px;border-radius:50%;font-size:10px}
.hud.s-compact .sp{min-width:70px}.hud.s-compact .sp b{font-size:24px}
.hud.s-compact .lim{width:32px;height:32px;font-size:12px;border-width:3px}
.hud.s-compact .k,.hud.s-compact .sep{display:none}
.hud.s-compact.race{border-color:#E070A8}
/* Style « Tableau de bord » : petite carte verticale */
.hud.s-tableau{flex-direction:column;align-items:stretch;gap:10px;width:250px;padding:14px;border-radius:18px;background:rgba(12,16,22,var(--op));border:1px solid rgba(255,255,255,.12);box-shadow:0 6px 20px rgba(0,0,0,.35)}
.hud.s-tableau .sep{display:none}
.hud.s-tableau .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hud.s-tableau .mid{display:flex;align-items:center;justify-content:space-between}
.hud.s-tableau .sp b{font-size:40px}
.hud.s-tableau .lim{width:46px;height:46px;font-size:16px}
.hud.s-tableau .rows{display:flex;flex-direction:column;gap:6px;border-top:1px solid rgba(255,255,255,.12);padding-top:10px}
.hud.s-tableau .k{flex-direction:row;justify-content:space-between;align-items:baseline}
.hud.s-tableau .k b{font-size:14px}
.hud.s-tableau.race{border-color:#E070A8}
/* Style « Minimal » : texte seul, sans fond */
.hud.s-minimal{gap:12px;padding:4px 8px;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.6)}
.hud.s-minimal .logo,.hud.s-minimal .sep,.hud.s-minimal .lim{display:none}
.hud.s-minimal .mode{background:none!important;padding:0;font-size:14px}
.hud.s-minimal .k{color:#E8EDF2}
.hud .top,.hud .mid,.hud .rows{display:contents}
.hud.s-tableau .top,.hud.s-tableau .mid,.hud.s-tableau .rows{display:flex}

.hud:not(.s-tableau) .logo{order:0}.hud:not(.s-tableau) .sp{order:1}.hud:not(.s-tableau) .lim{order:2}
.hud:not(.s-tableau) .sep{order:3}.hud:not(.s-tableau) .mode{order:4}.hud:not(.s-tableau) .k{order:5}

</style>
<link rel="stylesheet" href="hud-mission.css">
<script src="units.js"></script>
<script src="mission-time.js"></script>
<script src="hud-mission.js"></script>
<script src="hud-render.js"></script>
<link rel="stylesheet" href="hud-coach.css">
<script src="hud-coach.js"></script>
<link rel="stylesheet" href="hud-truck.css">
<script src="hud-truck.js"></script>
</head>
<body>
<div class="hud s-bandeau" data-hud>
  <div class="top"><div class="logo" data-h="logo">T&amp;C</div><span class="mode none" data-h="mode">SANS MISSION</span>
    <div class="coach-clock" aria-label="Heure du jeu"><svg aria-hidden="true" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.25"/><path d="M8 4.5V8l2.2 1.4"/></svg><b data-h="coachClock">--:--</b></div>
  </div>
  <div class="mid"><div class="sp" data-h="sp"><b data-h="speed">0</b><span data-u="sp">km/h</span></div><div class="lim" data-h="lim">90</div></div>
  <div class="sep"></div>
  <div class="rows">
    <div class="k" data-h="kLeft">Reste<b data-h="left">–</b></div>
    <div class="k" data-h="kKm">Mission<b data-h="km">–</b></div>
    <div class="k" data-h="kToday">Aujourd'hui<b data-h="today">0 km</b></div>
  </div>
</div>
<script>


const root = document.querySelector('[data-hud]');
if (window.tel && window.tel.onHud) window.tel.onHud(d => { document.body.classList.toggle('bas', (d.options || {}).position === 'bas'); if (window.UNITS) UNITS.set(d.units); hudRender(root, d); if (window.UNITS) UNITS.label(document); });
</script>
</body>
</html>
