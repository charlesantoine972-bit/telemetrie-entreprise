<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>HUD</title>
<style>
  html,body{margin:0;background:transparent;overflow:hidden;font-family:"Segoe UI",Inter,system-ui,sans-serif;user-select:none}
  body{display:flex;justify-content:center;padding-top:6px}
  body.bas{align-items:flex-end;padding:0 0 6px}
  .bar{display:flex;align-items:center;gap:14px;height:56px;padding:0 16px 0 10px;border-radius:16px;color:#fff;
    background:rgba(12,16,22,var(--op,.82));border:1px solid rgba(255,255,255,.12);box-shadow:0 6px 20px rgba(0,0,0,.35);transition:border-color .3s}
  .bar.race{border-color:#E070A8}
  .logo{width:36px;height:36px;border-radius:10px;background:#E7B655;color:#0F1720;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
  .logo.off{display:none}
  .sp{display:flex;align-items:baseline;gap:4px;min-width:96px}
  .sp b{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .sp span{font-size:12px;color:#C3CDD6}
  .sp.over b{color:#F4B860}
  .lim{width:38px;height:38px;border-radius:50%;background:#fff;border:4px solid #D64545;box-sizing:border-box;display:flex;align-items:center;justify-content:center;color:#111;font-weight:800;font-size:14px}
  .lim.off{display:none}
  .sep{width:1px;height:30px;background:rgba(255,255,255,.16)}
  .k{display:flex;flex-direction:column;gap:1px;font-size:11px;color:#C3CDD6;letter-spacing:.04em;text-transform:uppercase}
  .k b{font-size:16px;color:#fff;letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
  .mode{padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.06em}
  .mode.real{background:rgba(111,216,196,.18);color:#8FE6D4}
  .mode.race{background:rgba(224,112,168,.22);color:#F2A6CC}
  .mode.none{background:rgba(255,255,255,.08);color:#C3CDD6}
  .hidden{display:none}
</style>
</head>
<body>
  <div class="bar" id="bar">
    <div class="logo" id="logo">T&amp;C</div>
    <div class="sp" id="sp"><b id="speed">0</b><span>km/h</span></div>
    <div class="lim" id="lim">90</div>
    <div class="sep"></div>
    <span class="mode none" id="mode">SANS MISSION</span>
    <div class="k hidden" id="kLeft">Reste<b id="left">–</b></div>
    <div class="k hidden" id="kKm">Mission<b id="km">–</b></div>
    <div class="k" id="kToday">Aujourd'hui<b id="today">0 km</b></div>
  </div>
<script>
const $ = id => document.getElementById(id);
const fmt = (n, d = 0) => Number(n || 0).toLocaleString('fr-FR', { maximumFractionDigits: d, minimumFractionDigits: d });
function render(d){
  const o = d.options || {};
  document.body.classList.toggle('bas', o.position === 'bas');
  document.documentElement.style.setProperty('--op', (o.opacity || 82) / 100);
  $('logo').classList.toggle('off', o.logo === false);
  const L = d.live || {}, th = d.thresholds || { limit: 100, pct: 5 };
  const kmh = Math.round((L.speed || 0) * 3.6);
  $('speed').textContent = Math.abs(kmh);
  $('sp').classList.toggle('over', kmh > th.limit);
  const lim = Math.round((L.speedLimit || 0) * 3.6);
  $('lim').textContent = lim; $('lim').classList.toggle('off', !lim);
  const j = d.job;
  const m = $('mode'); m.className = 'mode ' + (!j ? 'none' : j.mode === 'course' ? 'race' : 'real');
  m.textContent = !j ? 'SANS MISSION' : j.mode === 'course' ? 'COURSE · ' + fmt(j.overPct, 0) + ' %' : 'RÉEL';
  $('bar').classList.toggle('race', !!j && j.mode === 'course');
  $('kLeft').classList.toggle('hidden', !(L.navDistance > 0));
  $('left').textContent = fmt((L.navDistance || 0) / 1000, 0) + ' km';
  $('kKm').classList.toggle('hidden', !j);
  if (j) $('km').textContent = fmt(j.loaded, 1) + ' km chargés';
  $('today').textContent = fmt((d.today && (d.today.loaded + d.today.empty)) || 0, 0) + ' km';
}
if (window.tel && window.tel.onHud) window.tel.onHud(render);
</script>
</body>
</html>
