# Construit l'installeur Windows et le publie dans les Releases GitHub
# dès que le numéro de version change dans package.json (ou à la demande).
# L'application installée détecte la nouvelle Release et se met à jour toute seule.
name: Publier une version

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
