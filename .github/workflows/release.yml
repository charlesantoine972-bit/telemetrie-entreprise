# Construit l'installeur Windows et le publie dans les Releases GitHub
# dès que le numéro de version change dans package.json (ou à la demande).
# L'application installée détecte la nouvelle Release et se met à jour toute seule.
name: Publier une version

on:
  push:
    # main : version normale. beta : « Truck & Coach Hub Bêta », publiée en pré-version.
    branches: [main, beta]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Outil de déchiffrement des sauvegardes (DecryptTruck, licence MIT), compilé depuis ses sources
      - name: Compiler decrypt_truck.exe
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install --git https://github.com/CoffeSiberian/DecryptTruck --rev 4b6a167d7b35a5234bb3dde17ac1532740860791 --root rust-tools decrypt_truck --locked
          mkdir -p resources/tools
          cp rust-tools/bin/decrypt_truck.exe resources/tools/
          cp THIRD_PARTY_NOTICES.txt resources/tools/
      - run: npm run ${{ github.ref_name == 'beta' && 'release:beta' || 'release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
