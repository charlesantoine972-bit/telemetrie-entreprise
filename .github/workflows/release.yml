# Construit l'installeur Windows et le publie dans les Releases GitHub
# à chaque nouvelle version (tag v0.2.0, v0.3.0, ...).
# L'application installée détecte la nouvelle Release et se met à jour toute seule.
name: Publier une version

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
